<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 남성 아이콘 -->
  <circle cx="80" cy="80" r="30" fill="black"/>
  <rect x="60" y="110" width="40" height="50" rx="10" fill="black"/>
  
  <!-- 여성 아이콘 -->
  <circle cx="220" cy="80" r="30" fill="black"/>
  <rect x="200" y="110" width="40" height="50" rx="10" fill="black"/>
  
  <!-- 하트 아이콘 -->
  <path d="M150 80
           C140 60, 110 60, 110 90
           C110 110, 150 130, 150 130
           C150 130, 190 110, 190 90
           C190 60, 160 60, 150 80 Z"
        fill="black"/>

  <!-- 돋보기 아이콘 -->
  <circle cx="150" cy="180" r="30" stroke="black" stroke-width="5" fill="none"/>
  <line x1="175" y1="205" x2="200" y2="230" stroke="black" stroke-width="8" stroke-linecap="round"/>
  <text x="145" y="188" font-size="24" fill="black">?</text>
  
  <!-- 텍스트 -->
  <text x="50" y="280" font-size="24" fill="black" font-weight="bold">비밀연애 의혹</text>
</svg>
